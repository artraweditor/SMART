name: Build (Linux x64, arm64)

on:
  push:
    # GitHub tag filters are globs, not regexes: these cover tags of the form
    # [0-9]+([.][0-9]+)+ with up to four components (1.2, 1.2.3, 1.2.3.4)
    tags:
      - '[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python minor version (python-build-standalone)'
        default: '3.12'
      pbs_tag:
        description: 'python-build-standalone release tag (empty = latest)'
        default: ''

permissions:
  contents: write   # needed to attach the archive to a release

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
  PBS_TAG: ${{ inputs.pbs_tag || '' }}
  # wxPython has no prebuilt Linux arm64 wheels: the arm64 job builds this
  # version from the sdist (the x64 one takes the latest prebuilt wheel)
  WXPYTHON_VERSION: '4.2.5'

jobs:
  build:
    name: Build (${{ matrix.arch }})
    # oldest available images, for the widest glibc compatibility
    runs-on: ${{ matrix.runner }}
    # building wxPython from source takes a long time
    timeout-minutes: 240
    env:
      PBS_TRIPLE: ${{ matrix.triple }}
      ARCH: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - name: Install system libraries (wxPython runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libsdl2-2.0-0 \
            libwebkit2gtk-4.0-37 libxtst6 xvfb

      - name: Install wxPython build dependencies (arm64)
        if: matrix.arch == 'arm64'
        run: |
          # the runner image has libunwind-NN-dev (from LLVM), which conflicts
          # with the libunwind-dev needed by libgstreamer1.0-dev
          sudo apt-get remove -y 'libunwind-*' || true
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev \
            libwebkit2gtk-4.0-dev libsdl2-dev libnotify-dev libgl1-mesa-dev \
            libglu1-mesa-dev libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev libjpeg-dev libpng-dev libtiff-dev \
            libsm-dev libxtst-dev

      - name: Get Python (python-build-standalone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pbs
          # the stripped build (the other one has debug info: libpython was 114 MB)
          gh release download $PBS_TAG --repo astral-sh/python-build-standalone \
            --pattern "cpython-${PYTHON_VERSION}.*-${PBS_TRIPLE}-install_only_stripped.tar.gz" \
            --dir pbs
          tar -xzf pbs/*.tar.gz -C pbs
          echo "PY=$PWD/pbs/python/bin/python3" >> "$GITHUB_ENV"

      - name: Cache the wxPython wheel (arm64)
        if: matrix.arch == 'arm64'
        id: wxcache
        uses: actions/cache@v4
        with:
          path: wxwheel
          key: wxpython-${{ env.WXPYTHON_VERSION }}-linux-arm64-py${{ env.PYTHON_VERSION }}

      - name: Build wxPython from source (arm64)
        if: matrix.arch == 'arm64' && steps.wxcache.outputs.cache-hit != 'true'
        run: |
          "$PY" -m pip install --upgrade pip setuptools wheel
          # the sdist build runs the wxWidgets build: about an hour
          "$PY" -m pip wheel --no-deps --wheel-dir wxwheel \
            "wxPython==${WXPYTHON_VERSION}"
          ls -l wxwheel

      - name: Install dependencies
        run: |
          "$PY" --version
          "$PY" -m pip install --upgrade pip setuptools wheel
          if [ "$ARCH" = arm64 ]; then
            "$PY" -m pip install --no-index --find-links wxwheel wxPython
          else
            # wxPython has no Linux wheels on PyPI: take the prebuilt one from the
            # wxPython extras server (slow at times, hence the long timeout and
            # retries). --only-binary: never fall back to a (failing) source build.
            "$PY" -m pip install --only-binary wxPython --timeout 120 --retries 10 \
              --find-links https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04/ \
              wxPython
          fi
          "$PY" -m pip install -r requirements.txt
          "$PY" -m pip install pyinstaller

      - name: Strip the wxPython libraries
        # the wxPython wheels are built with debug info: wx/_core.so alone is
        # 171 MB
        run: |
          WX=$("$PY" -c "import os, wx; print(os.path.dirname(wx.__file__))")
          du -sh "$WX"
          find "$WX" -name '*.so*' -type f -exec strip --strip-unneeded {} +
          du -sh "$WX"

      - name: Get ExifTool
        run: |
          VER=$(curl -fsSL https://exiftool.org/ver.txt )
          curl -fsSL -o exiftool.tar.gz "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-${VER}.tar.gz/download"
          tar -xzf exiftool.tar.gz
          # Perl distribution (needs perl on the target; run via its shebang)
          mkdir -p exiftool-bundle
          cp -R "Image-ExifTool-${VER}/exiftool" "Image-ExifTool-${VER}/lib" \
            "Image-ExifTool-${VER}/README" exiftool-bundle/
          chmod +x exiftool-bundle/exiftool
          exiftool-bundle/exiftool -ver

      - name: Build with PyInstaller
        # Trimmed bundle: of imagecodecs only the modules used by tifffile and
        # by the 16-bit PNG code (imgio.py) are included, and of scipy only
        # scipy.ndimage and what it imports; no tkinter, torch or torchvision
        run: |
          "$PY" -m PyInstaller --noconfirm --clean --name SMART \
            --paths src \
            --icon icons/app-icon-1024.png \
            --add-data "icons:icons" \
            --add-data "data:data" \
            --add-data "exiftool-bundle:exiftool" \
            --collect-binaries onnxruntime \
            --exclude-module torch --exclude-module torchvision \
            --exclude-module tkinter \
            --hidden-import imagecodecs._imcd --hidden-import imagecodecs._png \
            --hidden-import imagecodecs._shared --hidden-import imagecodecs._shared_cython \
            --exclude-module scipy.fft --exclude-module scipy.integrate --exclude-module scipy.interpolate --exclude-module scipy.optimize --exclude-module scipy.sparse \
            --exclude-module scipy.spatial --exclude-module scipy.stats --exclude-module scipy.signal --exclude-module scipy.io --exclude-module scipy.cluster \
            --exclude-module scipy.constants --exclude-module scipy.datasets --exclude-module scipy.differentiate --exclude-module scipy.odr \
            src/main.py

      - name: Size report
        run: |
          du -sh dist/SMART
          echo "--- largest top-level items"
          du -sh dist/SMART/_internal/* | sort -rh | head -25
          echo "--- largest files"
          find dist/SMART -type f -printf '%s %P\n' | sort -rn | head -40 \
            | awk '{printf "%7.1f MB  %s\n", $1/1048576, $2}'

      - name: Smoke test
        run: |
          xvfb-run -a dist/SMART/SMART --help
          EXIF=$(find dist -path '*/exiftool/exiftool' -type f | head -1)
          echo "bundled exiftool: $EXIF"
          "$EXIF" -ver

      - name: Package
        id: pkg
        run: |
          VERSION=$("$PY" -c "import re;print(re.search(r\"version = '([^']+)'\", open('src/config.py').read()).group(1))")
          NAME="SMART-${VERSION}-linux-${ARCH}"
          mv dist/SMART "dist/${NAME}"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          echo "file=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SMART-linux-${{ matrix.arch }}
          path: ${{ steps.pkg.outputs.file }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.file }}
