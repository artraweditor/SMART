name: Build (macOS Apple Silicon)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python minor version (python-build-standalone)'
        default: '3.12'
      pbs_tag:
        description: 'python-build-standalone release tag (empty = latest)'
        default: ''

permissions:
  contents: write   # needed to attach the archive to a release

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
  PBS_TAG: ${{ inputs.pbs_tag || '' }}
  PBS_TRIPLE: aarch64-apple-darwin

jobs:
  build:
    runs-on: macos-15   # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Get Python (python-build-standalone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pbs
          gh release download $PBS_TAG --repo astral-sh/python-build-standalone \
            --pattern "cpython-${PYTHON_VERSION}.*-${PBS_TRIPLE}-install_only.tar.gz" \
            --dir pbs
          tar -xzf pbs/*.tar.gz -C pbs
          echo "PY=$PWD/pbs/python/bin/python3" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          "$PY" --version
          "$PY" -m pip install --upgrade pip setuptools wheel
          "$PY" -m pip install torch torchvision   # includes MPS support
          # sam2 builds against the already-installed torch
          SAM2_BUILD_CUDA=0 "$PY" -m pip install --no-build-isolation -r requirements.txt
          "$PY" -m pip install pyinstaller

      - name: Get ExifTool
        run: |
          VER=$(curl -fsSL https://exiftool.org/ver.txt )
          curl -fsSL -o exiftool.tar.gz "https://sourceforge.net/projects/exiftool/files/Image-ExifTool-${VER}.tar.gz/download"
          tar -xzf exiftool.tar.gz
          # Perl distribution (needs perl on the target; run via its shebang)
          mkdir -p exiftool-bundle
          cp -R "Image-ExifTool-${VER}/exiftool" "Image-ExifTool-${VER}/lib" \
            "Image-ExifTool-${VER}/README" exiftool-bundle/
          chmod +x exiftool-bundle/exiftool
          exiftool-bundle/exiftool -ver

      - name: Select Xcode 26 for the app icon
        # icons/make_liquid_glass_icon.py compiles the icon into a Liquid
        # Glass Assets.car with actool, which needs Xcode 26
        run: |
          xc=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xc" ]; then
              sudo xcode-select -s "$xc"
          else
              echo "::warning::Xcode 26 not found, the app will use a plain icon"
          fi
          xcrun actool --version | head -5

      - name: Build the app icon
        run: |
          if "$PY" icons/make_liquid_glass_icon.py build/icon; then
              echo "ICON=build/icon/SMART.icns" >> "$GITHUB_ENV"
              echo "LIQUID_GLASS_ICON=build/icon/Assets.car" >> "$GITHUB_ENV"
          else
              echo "::warning::cannot build the Liquid Glass icon, using the plain one"
              echo "ICON=icons/app-icon-1024.png" >> "$GITHUB_ENV"
          fi

      - name: Build with PyInstaller
        run: |
          "$PY" -m PyInstaller --noconfirm --clean --name SMART \
            --windowed \
            --osx-bundle-identifier eu.fbk.smart \
            --paths src \
            --icon "$ICON" \
            --add-data "icons:icons" \
            --add-data "data:data" \
            --add-data "exiftool-bundle:exiftool" \
            --collect-all sam2 --collect-all hydra --collect-all omegaconf \
            --collect-submodules imagecodecs --collect-binaries onnxruntime \
            src/main.py

      - name: Add the Liquid Glass icon
        # Assets.car + CFBundleIconName make macOS 26 draw the icon filling the
        # whole rounded square (the .icns, set by PyInstaller, is the fallback)
        if: env.LIQUID_GLASS_ICON != ''
        run: |
          res=dist/SMART.app/Contents/Resources
          plist=dist/SMART.app/Contents/Info.plist
          cp "$LIQUID_GLASS_ICON" "$res/Assets.car"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIconName SMART" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleIconName string SMART" "$plist"
          # the bundle changed after PyInstaller signed it: sign it again
          codesign --force --deep --sign - dist/SMART.app
          codesign --verify --deep --strict dist/SMART.app

      - name: Smoke test
        run: |
          dist/SMART.app/Contents/MacOS/SMART --help
          EXIF=$(find dist -path '*/exiftool/exiftool' -type f | head -1)
          echo "bundled exiftool: $EXIF"
          "$EXIF" -ver

      - name: Package
        id: pkg
        run: |
          VERSION=$("$PY" -c "import re;print(re.search(r\"version = '([^']+)'\", open('src/config.py').read()).group(1))")
          NAME="SMART-${VERSION}-macos-arm64.zip"
          # ditto keeps symlinks and extended attributes, which a .app needs
          ditto -c -k --keepParent dist/SMART.app "${NAME}"
          echo "file=${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SMART-macos-arm64
          path: ${{ steps.pkg.outputs.file }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.file }}
