name: Build (Windows x64)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python minor version (python-build-standalone)'
        default: '3.12'
      pbs_tag:
        description: 'python-build-standalone release tag (empty = latest)'
        default: ''

permissions:
  contents: write   # needed to attach the archive to a release

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}
  PBS_TAG: ${{ inputs.pbs_tag || '' }}
  PBS_TRIPLE: x86_64-pc-windows-msvc

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Get Python (python-build-standalone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pbs
          gh release download $PBS_TAG --repo astral-sh/python-build-standalone \
            --pattern "cpython-${PYTHON_VERSION}.*-${PBS_TRIPLE}-install_only.tar.gz" \
            --dir pbs
          tar -xzf pbs/*.tar.gz -C pbs
          echo "PY=$(cygpath -m "$PWD/pbs/python/python.exe")" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          "$PY" --version
          "$PY" -m pip install --upgrade pip setuptools wheel
          # CPU-only PyTorch: the CUDA wheels would make the bundle huge
          "$PY" -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # sam2 builds against the already-installed torch; skip the CUDA extension
          SAM2_BUILD_CUDA=0 "$PY" -m pip install --no-build-isolation -r requirements.txt
          "$PY" -m pip install pyinstaller

      - name: Get ExifTool
        run: |
          VER=$(curl -fsSL https://exiftool.org/ver.txt )
          curl -fsSL -o exiftool.zip "https://sourceforge.net/projects/exiftool/files/exiftool-${VER}_64.zip/download"
          7z x exiftool.zip -oexiftool-unzipped
          # self-contained Windows executable + its exiftool_files directory
          mkdir -p exiftool-bundle
          cp -R exiftool-unzipped/*/exiftool_files exiftool-bundle/
          cp "exiftool-unzipped/"*"/exiftool(-k).exe" exiftool-bundle/exiftool.exe
          exiftool-bundle/exiftool.exe -ver

      - name: Build with PyInstaller
        # On Windows --add-data uses ';' as separator. --windowed: no
        # console; the program redirects its text output to a temporary
        # file shown in notepad (see src/frozen_env.py).
        run: |
          "$PY" -m PyInstaller --noconfirm --clean --name SMART \
            --windowed \
            --paths src \
            --icon icons/app-icon.png \
            --add-data "icons;icons" \
            --add-data "data;data" \
            --add-data "exiftool-bundle;exiftool" \
            --collect-all sam2 --collect-all hydra --collect-all omegaconf \
            --collect-submodules imagecodecs --collect-binaries onnxruntime \
            --exclude-module tkinter --exclude-module matplotlib \
            --exclude-module IPython --exclude-module pytest \
            --exclude-module torch.utils.tensorboard \
            src/main.py

      - name: Size report
        run: |
          du -sh dist/SMART
          echo "--- largest top-level items"
          du -sh dist/SMART/_internal/* | sort -rh | head -15
          echo "--- largest files"
          find dist/SMART -type f -size +20M -exec du -m {} + | sort -rn | head -25

      - name: Smoke test
        shell: pwsh
        run: |
          $env:SMART_OUTPUT_FILE = "$PWD\help.txt"
          Start-Process -Wait -FilePath dist\SMART\SMART.exe -ArgumentList '--help'
          Get-Content help.txt
          if (-not (Select-String -Path help.txt -Pattern 'usage:' -Quiet)) { throw "no --help output" }
          dist\SMART\_internal\exiftool\exiftool.exe -ver

      - name: Package
        id: pkg
        run: |
          VERSION=$("$PY" -c "import re;print(re.search(r\"version = '([^']+)'\", open('src/config.py').read()).group(1))")
          NAME="SMART-${VERSION}-windows-x64"
          mv dist/SMART "dist/${NAME}"
          (cd dist && 7z a -tzip -mx=9 -mfb=257 -mpass=15 "../${NAME}.zip" "${NAME}")
          echo "file=${NAME}.zip" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SMART-windows-x64
          path: ${{ steps.pkg.outputs.file }}

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pkg.outputs.file }}
